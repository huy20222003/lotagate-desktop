name: Desktop Release Build and Google Drive Upload

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: lotagate-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve supported release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      version: ${{ steps.targets.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.1

      - name: Resolve target matrix from the Desktop build source of truth
        id: targets
        shell: bash
        run: |
          echo "matrix=$(node scripts/build-release-matrix.mjs --github-matrix)" >> "$GITHUB_OUTPUT"
          desktop_version="$(node -p 'require("./package.json").version')"
          echo "version=$desktop_version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.targets.outputs.version }}
        run: |
          set -euo pipefail
          expected_tag="desktop-v${PACKAGE_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}."
            exit 1
          fi

  build:
    name: Build Desktop (${{ matrix.id }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare public Desktop runtime configuration
        shell: bash
        env:
          LOTAGATE_API_BASE_URL: ${{ vars.LOTAGATE_API_BASE_URL }}
          LOTAGATE_TRUSTED_ORIGIN: ${{ vars.LOTAGATE_TRUSTED_ORIGIN }}
          LOTAGATE_REMOTE_SERVER_URL: ${{ vars.LOTAGATE_REMOTE_SERVER_URL }}
          LOTAGATE_REMOTE_SERVER_GLOBAL_PREFIX: ${{ vars.LOTAGATE_REMOTE_SERVER_GLOBAL_PREFIX }}
          LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN: ${{ secrets.LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN }}
          LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY: ${{ secrets.LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${LOTAGATE_API_BASE_URL}" || -z "${LOTAGATE_TRUSTED_ORIGIN}" || -z "${LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY}" ]]; then
            echo "::error::Configure LOTAGATE_API_BASE_URL, LOTAGATE_TRUSTED_ORIGIN, and LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY as GitHub Repository Variables before running the Desktop release workflow."
            exit 1
          fi
          if [[ -n "${LOTAGATE_REMOTE_SERVER_URL}" && -z "${LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN}" ]]; then
            echo "::error::Configure LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN as a GitHub Repository Secret when LOTAGATE_REMOTE_SERVER_URL is configured."
            exit 1
          fi
          remote_server_global_prefix="${LOTAGATE_REMOTE_SERVER_GLOBAL_PREFIX:-api/v1}"
          {
            printf 'LOTAGATE_API_BASE_URL=%s\n' "${LOTAGATE_API_BASE_URL}"
            printf 'LOTAGATE_TRUSTED_ORIGIN=%s\n' "${LOTAGATE_TRUSTED_ORIGIN}"
            printf 'LOTAGATE_REMOTE_SERVER_URL=%s\n' "${LOTAGATE_REMOTE_SERVER_URL}"
            printf 'LOTAGATE_REMOTE_SERVER_GLOBAL_PREFIX=%s\n' "${remote_server_global_prefix}"
            printf 'LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN=%s\n' "${LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN}"
            printf 'LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY=%s\n' "${LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY}"
          } > .env

      - name: Build native whisper.cpp runtime for macOS
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          whisper_output="${RUNNER_TEMP}/lotagate-whisper/whisper-cli"
          node scripts/build-whisper-cpp.mjs --output "$whisper_output"
          echo "LOTAGATE_WHISPER_CPP_EXECUTABLE=$whisper_output" >> "$GITHUB_ENV"

      - name: Build validated native release target
        env:
          LOTAGATE_SPEECH_MODEL_URL: ${{ vars.LOTAGATE_SPEECH_MODEL_URL }}
        run: npm run release:target -- --target "${{ matrix.id }}" --skip-install

      - name: Upload target artifacts to the workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.id }}
          path: out/make
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload complete Desktop release to Google Drive
    needs: [plan, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all target artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: false

      - name: Authenticate to Google Cloud without a long-lived key
        id: google-auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc693a # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.LOTAGATE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.LOTAGATE_GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive

      - name: Upload immutable release tree to Google Drive
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          LOTAGATE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.LOTAGATE_DRIVE_PARENT_FOLDER_ID }}
        run: node scripts/upload-google-drive.mjs --root release-artifacts --version "$RELEASE_VERSION"

  cleanup:
    name: Delete temporary Desktop release artifacts
    needs: [build, upload]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete temporary Desktop release artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          page=1
          while :; do
            response="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100&page=${page}")"

            artifact_ids="$(jq -r '.artifacts[] | select(.expired == false and (.name | startswith("desktop-"))) | .id' <<< "${response}")"
            while IFS= read -r artifact_id; do
              [[ -z "${artifact_id}" ]] && continue
              curl --fail --silent --show-error --request DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
                > /dev/null
            done <<< "${artifact_ids}"

            artifact_count="$(jq '.artifacts | length' <<< "${response}")"
            [[ "${artifact_count}" -lt 100 ]] && break
            page=$((page + 1))
          done
