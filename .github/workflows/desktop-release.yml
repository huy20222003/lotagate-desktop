name: Desktop Release Build and Artifact Upload

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: lotagate-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve supported release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      version: ${{ steps.targets.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.1

      - name: Resolve target matrix from the Desktop build source of truth
        id: targets
        shell: bash
        run: |
          echo "matrix=$(node scripts/build-release-matrix.mjs --github-matrix)" >> "$GITHUB_OUTPUT"
          desktop_version="$(node -p 'require("./package.json").version')"
          echo "version=$desktop_version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.targets.outputs.version }}
        run: |
          set -euo pipefail
          expected_tag="desktop-v${PACKAGE_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}."
            exit 1
          fi

  guest-image:
    name: Prepare WSL2 guest image (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Prepare container-backed WSL2 guest image
        run: node scripts/prepare-wsl2-image.mjs --arch "${{ matrix.arch }}" --container

      - name: Upload prepared WSL2 guest image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-wsl2-image-${{ matrix.arch }}
          path: resources/sandbox/wsl2/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build Desktop (${{ matrix.id }})
    needs: [plan, guest-image]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure HTTPS for Git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare public Desktop runtime configuration
        shell: bash
        env:
          LOTAGATE_API_BASE_URL: ${{ secrets.LOTAGATE_API_BASE_URL }}
          LOTAGATE_TRUSTED_ORIGIN: ${{ secrets.LOTAGATE_TRUSTED_ORIGIN }}
          LOTAGATE_REMOTE_SERVER_URL: ${{ secrets.LOTAGATE_REMOTE_SERVER_URL }}
          LOTAGATE_REMOTE_SERVER_GLOBAL_PREFIX: ${{ secrets.LOTAGATE_REMOTE_SERVER_GLOBAL_PREFIX }}
          LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN: ${{ secrets.LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN }}
          LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY: ${{ secrets.LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${LOTAGATE_API_BASE_URL}" || -z "${LOTAGATE_TRUSTED_ORIGIN}" || -z "${LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY}" ]]; then
            echo "::error::Configure LOTAGATE_API_BASE_URL, LOTAGATE_TRUSTED_ORIGIN, and LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY as GitHub Repository Secrets before running the Desktop release workflow."
            exit 1
          fi
          if [[ -n "${LOTAGATE_REMOTE_SERVER_URL}" && -z "${LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN}" ]]; then
            echo "::error::Configure LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN as a GitHub Repository Secret when LOTAGATE_REMOTE_SERVER_URL is configured."
            exit 1
          fi
          remote_server_global_prefix="${LOTAGATE_REMOTE_SERVER_GLOBAL_PREFIX:-api/v1}"
          {
            printf 'LOTAGATE_API_BASE_URL=%s\n' "${LOTAGATE_API_BASE_URL}"
            printf 'LOTAGATE_TRUSTED_ORIGIN=%s\n' "${LOTAGATE_TRUSTED_ORIGIN}"
            printf 'LOTAGATE_REMOTE_SERVER_URL=%s\n' "${LOTAGATE_REMOTE_SERVER_URL}"
            printf 'LOTAGATE_REMOTE_SERVER_GLOBAL_PREFIX=%s\n' "${remote_server_global_prefix}"
            printf 'LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN=%s\n' "${LOTAGATE_REMOTE_SERVER_ENROLLMENT_TOKEN}"
            printf 'LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY=%s\n' "${LOTAGATE_DESKTOP_UPDATE_PUBLIC_KEY}"
          } > .env

      - name: Build native whisper.cpp runtime for macOS
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          whisper_output="${RUNNER_TEMP}/lotagate-whisper/whisper-cli"
          node scripts/build-whisper-cpp.mjs --output "$whisper_output"
          echo "LOTAGATE_WHISPER_CPP_EXECUTABLE=$whisper_output" >> "$GITHUB_ENV"

      - name: Download prepared WSL2 guest image
        if: matrix.platform == 'win32'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: desktop-wsl2-image-${{ matrix.architecture }}
          path: resources/sandbox/wsl2/${{ matrix.architecture }}

      - name: Build validated native release target
        env:
          LOTAGATE_SPEECH_MODEL_URL: ${{ vars.LOTAGATE_SPEECH_MODEL_URL }}
        run: npm run release:target -- --target "${{ matrix.id }}" --skip-install

      - name: Upload target artifacts to the workflow run
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.id }}
          path: out/make
          if-no-files-found: error
          retention-days: 7
